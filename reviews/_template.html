<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 依 AGENTS.md：格式為「片名｜片單收藏室」 -->
  <title>片名｜片單收藏室</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<!-- data-film-id 必須與 data/films.js 的 id、本檔檔名相同 -->
<body data-film-id="作品代號">

  <header class="site-header">
    <a class="brand" href="../index.html">片單收藏室</a>
    <nav class="site-nav">
      <a href="../index.html">片單</a>
      <a href="../about.html">關於</a>
    </nav>
  </header>

  <main class="review">
    <a class="back-link" href="../index.html">← 回到片單</a>

    <!-- 1. 基本資料、2. 一句話短評：由 main.js 從 films.js 自動帶入，不要手寫 -->
    <section class="review-hero" id="film-info"></section>

    <!-- 3. 簡介：80 到 150 字，只寫開頭設定 -->
    <section class="review-section" id="synopsis">
      <h2>簡介</h2>
      <p>簡介內容。</p>
    </section>

    <!-- 4. 無雷心得：200 到 400 字，第一人稱，2 到 3 段 -->
    <section class="review-section" id="thoughts">
      <h2>無雷心得</h2>
      <p>第一段。</p>
      <p>第二段。</p>
    </section>

    <!-- 5. 推薦對象：各 2 到 3 點 -->
    <section class="review-section" id="recommend">
      <h2>推薦對象</h2>
      <div class="rec-grid">
        <div class="rec rec-yes">
          <h3>適合你，如果……</h3>
          <ul>
            <li>第一點</li>
            <li>第二點</li>
          </ul>
        </div>
        <div class="rec rec-no">
          <h3>可能不適合，如果……</h3>
          <ul>
            <li>第一點</li>
            <li>第二點</li>
          </ul>
        </div>
      </div>
    </section>

    <!-- 6. 個人評分：星星與哭點指數自動帶入，下方寫一句評分理由 -->
    <section class="review-section" id="score">
      <h2>個人評分</h2>
      <div class="rating-display" id="rating-display"></div>
      <p class="rating-reason">一句評分理由。</p>
    </section>

    <p class="added-date" id="added-date"></p>
  </main>

  <footer class="site-footer">
    <p>片單收藏室 · 所有心得皆無雷</p>
    <p>海報版權屬原片商所有，僅供心得介紹使用。</p>
  </footer>

  <script src="../data/films.js"></script>
  <script src="../assets/js/main.js"></script>
</body>
</html>
